# Alembic configuration for the Auto Backlinker API.
#
# The database URL is intentionally left empty here: ``alembic/env.py`` reads
# it from the application settings (``AUTOBL_DATABASE_URL`` or the local
# SQLite file inside the data directory) so migrations always target the same
# database as the running application.
#
# Usage (from apps/api):
#   ../../.venv/bin/python -m alembic upgrade head
#   ../../.venv/bin/python -m alembic downgrade base
#   ../../.venv/bin/python -m alembic revision -m "add column"

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
